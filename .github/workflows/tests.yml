name: Tests

# Corre las pruebas cada vez que subo cambios a GitHub
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr pruebas automáticas
        run: python -m unittest -v

      - name: Correr los ejemplos del reto
        run: python main.py
